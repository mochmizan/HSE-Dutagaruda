services:
  postgres:
    image: postgres:17-alpine
    container_name: viaannn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viaannn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-viaannn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viaannn} -d ${POSTGRES_DB:-viaannn}"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: viaannn-garage
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage/data
      - garagemeta:/var/lib/garage/meta

  garage-init:
    image: alpine:3.20
    container_name: viaannn-garage-init
    depends_on:
      - garage
    environment:
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-viaannn-media}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./garage-init.sh:/garage-init.sh:ro
    entrypoint: ["/bin/sh", "/garage-init.sh"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: viaannn-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-viaannn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-viaannn}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_REGION: ${GARAGE_REGION:-garage}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-viaannn-media}
      PUBLIC_STORAGE_BASE: ${PUBLIC_STORAGE_BASE:-/storage}

  caddy:
    image: caddy:2.9-alpine
    container_name: viaannn-caddy
    restart: unless-stopped
    depends_on:
      - api
      - garage
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-off}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/web/dist:/srv/web:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  garagedata:
  garagemeta:
  caddydata:
  caddyconfig:
